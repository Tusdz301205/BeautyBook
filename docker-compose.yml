services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: glowbook_db
      POSTGRES_USER: glowbook
      POSTGRES_PASSWORD: glowbook_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glowbook -d glowbook_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./beauty-booking-api-main
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://glowbook:glowbook_local@postgres:5432/glowbook_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-development-access-secret-change-in-production
      JWT_REFRESH_SECRET: local-development-refresh-secret-change-in-production
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      CORS_ORIGINS: http://localhost:8080
      BOOKING_TIME_ZONE: Asia/Ho_Chi_Minh
      FRONTEND_URL: http://localhost:8080
      UPLOAD_DIR: /app/uploads
      SENSITIVE_DATA_ENCRYPTION_KEY: ${SENSITIVE_DATA_ENCRYPTION_KEY:-YmVhdXR5Ym9vay1sb2NhbC1kZXYta2V5LTMyYnl0ZXM=}
      SENSITIVE_DATA_KEY_VERSION: ${SENSITIVE_DATA_KEY_VERSION:-v1}
      PRIVACY_EXPORT_TTL_MINUTES: ${PRIVACY_EXPORT_TTL_MINUTES:-15}
    volumes:
      - media_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./beauty-booking-web-main/beauty-booking-web-main
      args:
        VITE_API_BASE: /api/v1
        VITE_WS_URL: /
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
